  </defs>
  <rect width="1024" height="1024" rx="225.3" fill="url(#tile)"/>
  <g transform="translate(0 16.4)" fill="#002620" opacity="0.25" filter="url(#shadow)">
    <rect x="194.6" y="384" width="634.9" height="256" rx="51.2"/>
    <rect x="384" y="194.6" width="256" height="634.9" rx="51.2"/>
  </g>
  <g fill="#fff">
    <rect x="194.6" y="384" width="634.9" height="256" rx="51.2"/>
    <rect x="384" y="194.6" width="256" height="634.9" rx="51.2"/>
  </g>
  <polyline clip-path="url(#cross)" fill="none" stroke="#00897B" stroke-width="45"
    stroke-linecap="round" stroke-linejoin="round"
    points="194.6,512 378.9,512 425,430.1 486.4,634.9 558.1,317.4 609.3,512 829.4,512"/>
