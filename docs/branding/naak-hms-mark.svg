<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="NAAK HMS">
  <!-- Same geometry as NaakMarkPainter (lib/widgets/naak_logo.dart). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26A69A"/>
      <stop offset="0.45" stop-color="#00897B"/>
      <stop offset="1" stop-color="#004D40"/>
    </linearGradient>
    <clipPath id="cross">
      <rect x="194.6" y="384" width="634.9" height="256" rx="51.2"/>
      <rect x="384" y="194.6" width="256" height="634.9" rx="51.2"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
