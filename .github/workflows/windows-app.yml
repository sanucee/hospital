name: Windows app

# Builds NAAK HMS for Windows (installers + portable zips):
# - on every push to main that touches the app or server: download them from
#   the run's "Artifacts" section (sign in to GitHub);
# - when a version tag such as v1.1.0 is pushed: also published as a GitHub
#   release.
#
# What is built (see docs/NETWORK-INSTALL.md):
# - NAAK-HMS-Setup-<v>.exe: the app for every computer. It works on its own,
#   or with NAAK HMS Server on the hospital network.
# - NAAK-HMS-Server-Setup-<v>.exe: the hospital's own database server for
#   the local network, including the web version of the app.
# - NAAK-HMS-Setup-<v>-cloud.exe: the app using Google Firebase instead;
#   only once lib/firebase_options.dart has been generated.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'lib/**'
      - 'server/**'
      - 'windows/**'
      - 'web/**'
      - 'pubspec.*'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows app and server
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Version and editions
        id: meta
        run: |
          $pubspec = (Select-String pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { $pubspec }
          $cloud = -not (Select-String lib/firebase_options.dart -Pattern 'Placeholder' -Quiet)
          "version=$version" >> $env:GITHUB_OUTPUT
          "cloud=$($cloud.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "Version $version; cloud edition: $cloud"

      - name: Install dependencies
        run: |
          flutter pub get
          Push-Location server; dart pub get; Pop-Location

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the app
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $editions = @(@{ suffix = ''; firebase = 'false' })
          if ('${{ steps.meta.outputs.cloud }}' -eq 'true') {
            $editions += @{ suffix = '-cloud'; firebase = 'true' }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($e in $editions) {
            flutter build windows --release --build-name=$version `
              --dart-define=USE_FIREBASE=$($e.firebase)
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $release = 'build\windows\x64\runner\Release'
            # The Visual C++ runtime, so the app starts on PCs that don't
            # have it installed (app-local deployment).
            foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
              Copy-Item "$env:SystemRoot\System32\$dll" $release
            }
            $staged = "dist\NAAK-HMS-$version$($e.suffix)"
            Copy-Item $release $staged -Recurse
            Compress-Archive "$staged\*" "$staged-windows.zip"
            & $iscc "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path $staged).Path)" `
              "/DOutputDir=$((Resolve-Path dist).Path)" "/DEdition=$($e.suffix)" `
              windows\installer\naak-hms.iss
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Remove-Item $staged -Recurse
            Remove-Item build\windows -Recurse -Force
          }

      - name: Build the server
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $staged = "dist\NAAK-HMS-Server-$version"
          New-Item -ItemType Directory -Force $staged | Out-Null
          Push-Location server
          dart compile exe bin/naak_server.dart -o "..\$staged\naak_server.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          # The web version, which connects back to the server it came from.
          flutter build web --release --dart-define=LAN_FROM_ORIGIN=true -o build\web-lan
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item build\web-lan "$staged\web" -Recurse
          Compress-Archive "$staged\*" "$staged-windows.zip"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path $staged).Path)" `
            "/DOutputDir=$((Resolve-Path dist).Path)" `
            windows\installer\naak-hms-server.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item $staged -Recurse
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: NAAK-HMS-windows-${{ steps.meta.outputs.version }}
          path: dist/*
          retention-days: 30

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: NAAK HMS ${{ steps.meta.outputs.version }}
          files: dist/*
          body: |
            NAAK HMS ${{ steps.meta.outputs.version }} for Windows. Installation
            guide: docs/NETWORK-INSTALL.md.

            - `NAAK-HMS-Server-Setup-….exe`: install on ONE computer to hold
              the hospital's database on the local network.
            - `NAAK-HMS-Setup-….exe`: install on every computer. Works on its
              own, or connected to the hospital server.
            - `NAAK-HMS-Setup-…-cloud.exe` (if present): uses Google Firebase
              instead of a hospital server.
            - The `.zip` files contain the same programs without an installer.
